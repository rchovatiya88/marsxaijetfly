<!doctype html><html lang="en"><meta charset="utf-8"><title>Browser frame pacing baseline</title><style>body{font:18px/1.5 monospace;background:#102028;color:#dfefed;padding:40px}button{font:inherit;padding:12px}pre{white-space:pre-wrap}</style><h1>Browser frame pacing baseline</h1><p>No game, WebGL, animation or network traffic. Compare with the combat profiler in the same browser.</p><button id="start">Measure 300 frames</button><pre id="report">Ready</pre><script>
start.onclick=()=>{start.disabled=true;const samples=[];let previous=performance.now(),count=0;const tick=now=>{if(count++>30)samples.push(now-previous);previous=now;if(samples.length<300){report.textContent=`Measuring ${samples.length}/300 frames`;requestAnimationFrame(tick);}else{samples.sort((a,b)=>a-b);report.textContent=`Idle browser baseline\n300 samples\nMedian ${samples[150].toFixed(1)} ms\np95 ${samples[285].toFixed(1)} ms\n${navigator.userAgent}`;start.disabled=false;}};requestAnimationFrame(tick)};
</script></html>
